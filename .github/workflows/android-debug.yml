# 只构建 debug 包并跑单元测试；不涉及任何签名或密钥
name: android-debug

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # linphone 依赖来自 download.linphone.org 的 maven 仓库，已在 settings.gradle.kts 声明
      - run: ./gradlew assembleDebug testDebugUnitTest :app:rootModuleZip --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: phonebox-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: phonebox-root-module
          path: android/app/build/outputs/root-module/*.zip
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
