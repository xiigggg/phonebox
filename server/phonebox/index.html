<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="电话信箱">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>电话信箱</title>
<style>
:root{
  --bg:#f4f5f2;--card:#ffffff;--card2:#f0f2ee;--ink:#1c1f1d;--ink2:#4c524e;--mut:#8b918c;--line:#e6e8e3;
  --acc:#2e7d4f;--acc-soft:#e3efe7;--danger:#c4442f;--danger-soft:#fbe9e5;--warn:#a76b00;--warn-soft:#fbf0d9;
  --k-code:#2e7d4f;--k-fin:#b27a1c;--k-exp:#3f6fb5;--k-tel:#2d8a8a;--k-trip:#7a58b0;--k-me:#d0612d;--k-note:#69788a;--k-spam:#c4442f;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 6px 20px rgba(20,30,25,.05);
  --tabbar:62px;--radius:18px;
}
html[data-theme=dark]{
  --bg:#101211;--card:#1a1d1b;--card2:#232724;--ink:#e9ece9;--ink2:#b9bfba;--mut:#7f8681;--line:#2a2e2b;
  --acc:#6cc191;--acc-soft:#1f3328;--danger:#ef8a74;--danger-soft:#3a201b;--warn:#e2b04f;--warn-soft:#352a14;
  --k-code:#6cc191;--k-fin:#e2b04f;--k-exp:#82a8e6;--k-tel:#6cc7c4;--k-trip:#b89be4;--k-me:#f0976a;--k-note:#9aa9ba;--k-spam:#ef8a74;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"HarmonyOS Sans SC","MiSans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block;flex:0 0 auto}

/* ── 外壳：手机单栏；宽屏左右双栏 ── */
.app{display:flex;height:100%;max-width:1180px;margin:0 auto}
.list-pane{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative}
.detail-pane{display:contents}
.placeholder{display:none}
.top{padding:calc(env(safe-area-inset-top) + 14px) 18px 8px;background:var(--bg);position:sticky;top:0;z-index:5}
.top-row{display:flex;align-items:center;gap:6px}
.big-title{font-size:30px;font-weight:700;letter-spacing:.01em}
.sub-title{font-size:12.5px;color:var(--mut);margin-top:1px;min-height:18px}
.top-actions{margin-left:auto;display:flex;gap:4px}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.ibtn:active{background:var(--card2)}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:14px;padding:0 12px;height:40px;color:var(--mut)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;color:var(--ink);min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 8px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:999px;background:var(--card);color:var(--ink2);font-size:13.5px;box-shadow:0 0 0 1px var(--line) inset;white-space:nowrap;transition:background .15s,color .15s}
.chip b{font-weight:600;margin-left:4px;color:var(--mut);font-size:12px}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip.on b{color:inherit;opacity:.7}
.scroll{flex:1;overflow-y:auto;padding:4px 14px calc(var(--tabbar) + env(safe-area-inset-bottom) + 90px);-webkit-overflow-scrolling:touch}

/* ── 置顶验证码卡 ── */
.otp{margin:4px 2px 14px;border-radius:var(--radius);padding:16px 16px 14px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#2e7d4f,#1f5f3c);box-shadow:0 10px 28px rgba(46,125,79,.28)}
html[data-theme=dark] .otp{background:linear-gradient(135deg,#2a6a45,#163d29)}
.otp::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.otp-head{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.9}
.otp-head .t{margin-left:auto;font-size:12px;opacity:.8}
.otp-body{display:flex;align-items:center;gap:12px;margin-top:8px}
.otp-code{font:700 34px/1.1 "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.18em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.otp-copy{background:#fff;color:#1f5f3c;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.otp-copy:active{transform:scale(.97)}
.otp-from{font-size:12.5px;opacity:.85;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 会话列表 ── */
.group-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.conv{display:flex;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left;position:relative}
.conv+.conv::before{content:"";position:absolute;left:68px;right:0;top:0;height:1px;background:var(--line)}
.conv:active,.conv.sel{background:var(--card2)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-weight:600;font-size:17px;
  color:#fff;background:var(--kc,var(--k-note))}
.avatar.sm{width:36px;height:36px;font-size:14px}
.conv-main{flex:1;min-width:0}
.conv-l1{display:flex;align-items:center;gap:6px}
.conv-name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-time{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap;flex:0 0 auto}
.conv-l2{display:flex;align-items:center;gap:8px;margin-top:2px}
.conv-prev{flex:1;min-width:0;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-prev em{font-style:normal;color:var(--kc);font-weight:600}
.unread{min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center;flex:0 0 auto}
.kind{font-size:10.5px;padding:2px 6px;border-radius:5px;color:var(--kc);background:color-mix(in srgb,var(--kc) 13%,transparent);white-space:nowrap;flex:0 0 auto;font-weight:500}
.mini-copy{flex:0 0 auto;display:flex;align-items:center;gap:4px;font:600 13px "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;
  color:var(--k-code);background:var(--acc-soft);border-radius:8px;padding:4px 8px}
.mini-copy:active{transform:scale(.96)}

/* ── 对话页 ── */
.thread{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.thread.open{transform:none}
.th-head{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 10px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.th-title{flex:1;min-width:0}
.th-name{font-weight:650;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-body{flex:1;overflow-y:auto;padding:12px 14px 20px}
.day{text-align:center;font-size:12px;color:var(--mut);margin:14px 0 8px}
.bubble-row{display:flex;margin:6px 0}
.bubble-row.out{justify-content:flex-end}
.bubble{max-width:min(82%,560px);background:var(--card);border-radius:18px 18px 18px 6px;padding:10px 13px;box-shadow:var(--shadow);font-size:15px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.bubble-row.out .bubble{background:var(--acc);color:#fff;border-radius:18px 18px 6px 18px}
.bubble mark{background:color-mix(in srgb,var(--k-code) 18%,transparent);color:var(--k-code);font-weight:700;border-radius:4px;padding:0 3px;letter-spacing:.04em}
.bubble .meta{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--mut);white-space:normal}
.bubble-row.out .bubble .meta{color:rgba(255,255,255,.8)}
.card-strip{display:flex;align-items:center;gap:8px;margin:-2px -4px 8px;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--kc) 10%,var(--card2));white-space:normal}
.card-strip .lbl{font-size:12px;color:var(--kc);font-weight:600}
.card-strip .val{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.act-row{display:flex;gap:8px;margin-top:8px;white-space:normal}
.act{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--acc-soft);color:var(--k-code);font-size:13.5px;font-weight:600}
.act:active{transform:scale(.97)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);border-top:1px solid var(--line);background:var(--bg)}
.composer textarea{flex:1;resize:none;border:0;outline:0;background:var(--card);border-radius:20px;padding:10px 14px;max-height:120px;min-height:42px;font-size:15px;box-shadow:0 0 0 1px var(--line) inset}
.send{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.send:disabled{opacity:.4}
.hint{font-size:12px;color:var(--mut);padding:0 16px 6px}

/* ── 通话 ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 2px 14px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
.stat.danger b{color:var(--danger)}
.sec-title{font-size:13px;color:var(--mut);margin:16px 6px 8px;font-weight:600}
.call{display:flex;gap:12px;align-items:center;padding:11px 14px;width:100%;text-align:left;position:relative}
.call+.call::before{content:"";position:absolute;left:62px;right:0;top:0;height:1px;background:var(--line)}
.call:active{background:var(--card2)}
.dir{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:var(--kc);background:color-mix(in srgb,var(--kc) 12%,transparent)}
.call-main{flex:1;min-width:0}
.call-num{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call-num.missed{color:var(--danger)}
.call-num small{font-weight:500;color:var(--mut);font-size:13px;margin-left:4px}
.call-l2{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.nature{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--ink2);font-weight:500}
.nature.bad{background:var(--danger-soft);color:var(--danger)}
.nature.warn{background:var(--warn-soft);color:var(--warn)}
.nature.info{background:color-mix(in srgb,var(--k-exp) 13%,transparent);color:var(--k-exp)}
.call-l2 .online{font-size:10.5px;color:var(--k-exp)}
.call-time{font-size:12px;color:var(--mut);text-align:right;flex:0 0 auto}

/* ── 拦截 ── */
.spam{padding:12px 14px;position:relative}
.spam+.spam::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--line)}
.spam-l1{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.spam-l1 b{color:var(--ink);font-size:14px}
.spam-body{font-size:13.5px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ── 底栏 / 浮钮 / 弹层 ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar-in{display:flex;width:100%;max-width:520px;height:var(--tabbar)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--mut);position:relative}
.tab.on{color:var(--acc);font-weight:600}
.tab .dot{position:absolute;top:7px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:10.5px;display:grid;place-items:center;font-weight:600}
.dot[hidden],[hidden]{display:none!important}
.fab{position:fixed;right:20px;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 18px);z-index:19;width:56px;height:56px;border-radius:18px;
  background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(46,125,79,.35)}
.fab:active{transform:scale(.95)}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-mask.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);
  transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:17px;margin-bottom:12px}
.field{width:100%;border:0;outline:0;background:var(--card2);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:10px}
textarea.field{resize:none;min-height:110px}
.btn{width:100%;height:46px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600;font-size:15px}
.btn.ghost{background:var(--card2);color:var(--ink)}
.menu .btn{margin-bottom:8px}
.form-msg{font-size:13px;color:var(--mut);min-height:20px;margin:-2px 2px 8px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;transition:all .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:14px}
.empty svg{margin:0 auto 10px;opacity:.5}
.foot{text-align:center;font-size:11.5px;color:var(--mut);padding:18px 0 4px;line-height:1.8}


/* ── 宽屏：左列表右对话 ── */
@media (min-width:900px){
  .app{padding:0 16px}
  .list-pane{flex:0 0 400px;border-right:1px solid var(--line)}
  .app.single .list-pane{flex:1;border-right:0;max-width:760px;margin:0 auto}
  .detail-pane{display:flex;flex:1;min-width:0;flex-direction:column;height:100%}
  .placeholder{flex:1;display:grid;place-items:center;color:var(--mut);font-size:14px;text-align:center}
  .app.single .detail-pane{display:none}
  .thread{position:static;transform:none;transition:none;flex:1;min-height:0}
  .thread:not(.open){display:none}
  .th-back{display:none}
  .tabbar{left:0;right:auto;width:400px;margin-left:max(16px,calc((100vw - 1180px)/2 + 16px));background:var(--bg)}
  .app.single~.tabbar{width:760px;left:50%;margin-left:-380px}
  .fab{right:auto;left:calc(max(16px,(100vw - 1180px)/2 + 16px) + 400px - 76px)}
  .app.single~.fab{left:calc(50% + 380px - 76px)}
  .toast{left:50%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="list-pane">
    <header class="top">
      <div class="top-row">
        <div>
          <h1 class="big-title" id="title">信息</h1>
          <div class="sub-title" id="subtitle"></div>
        </div>
        <div class="top-actions">
          <button class="ibtn" id="markRead" title="全部标为已读" aria-label="全部标为已读"></button>
          <button class="ibtn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色"></button>
          <button class="ibtn" id="logoutBtn" title="退出登录" aria-label="退出登录"></button>
        </div>
      </div>
      <label class="search" id="searchBox"><span id="searchIco"></span><input id="q" type="search" placeholder="搜索短信、号码、签名" autocomplete="off"></label>
      <div class="chips" id="chips"></div>
    </header>
    <div class="scroll" id="list"></div>
  </section>
  <section class="detail-pane" id="detail">
    <div class="placeholder" id="placeholder"><div><div id="phIco"></div><p style="margin-top:10px">选择左侧的会话查看完整短信</p></div></div>
    <div class="thread" id="thread">
      <div class="th-head">
        <button class="ibtn th-back" id="back" aria-label="返回"></button>
        <span class="avatar sm" id="thAvatar"></span>
        <div class="th-title"><div class="th-name" id="thName"></div><div class="th-sub" id="thSub"></div></div>
        <button class="ibtn" id="thCopy" title="复制号码" aria-label="复制号码"></button>
      </div>
      <div class="th-body" id="thBody"></div>
      <div class="hint" id="thHint"></div>
      <div class="composer">
        <textarea id="reply" rows="1" placeholder="回复短信"></textarea>
        <button class="send" id="sendReply" aria-label="发送" disabled></button>
      </div>
    </div>
  </section>
</div>
<nav class="tabbar"><div class="tabbar-in">
  <button class="tab on" data-tab="msg"><span id="tIcoMsg"></span>信息<span class="dot" id="dotMsg" hidden></span></button>
  <button class="tab" data-tab="call"><span id="tIcoCall"></span>通话<span class="dot" id="dotCall" hidden></span></button>
  <button class="tab" data-tab="block"><span id="tIcoBlock"></span>拦截</button>
</div></nav>
<button class="fab" id="fab" aria-label="新建短信"></button>
<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="composeSheet" role="dialog" aria-label="新建短信">
  <div class="grab"></div><h3>新建短信</h3>
  <input class="field" id="cTo" inputmode="tel" placeholder="收件人号码">
  <textarea class="field" id="cText" placeholder="短信内容（中文约 70 字一条）"></textarea>
  <div class="form-msg" id="cMsg"></div>
  <button class="btn" id="cSend">发送</button>
</div>
<div class="sheet menu" id="callSheet" role="dialog" aria-label="号码操作">
  <div class="grab"></div><h3 id="csTitle"></h3>
  <p class="form-msg" id="csSub"></p>
  <button class="btn" id="csCopy">复制号码</button>
  <button class="btn ghost" id="csSms">发短信</button>
  <button class="btn ghost" id="csThread">查看与该号码的短信</button>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
// ───────── 图标 ─────────
var I={
  msg:'<path d="M4 5h16a1 1 0 011 1v10a1 1 0 01-1 1H9l-4 3.5V17H4a1 1 0 01-1-1V6a1 1 0 011-1z"/>',
  call:'<path d="M6.5 4h3l1.5 4-2 1.5a11 11 0 005.5 5.5l1.5-2 4 1.5v3a2 2 0 01-2 2A15 15 0 014.5 6a2 2 0 012-2z"/>',
  shield:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  block:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>',

// ───────── 工具 ─────────
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
var WEEK=['周日','周一','周二','周三','周四','周五','周六'];
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function relTime(ts){
  var d=new Date(ts*1000),now=new Date(),diff=(now-d)/1000;
  if(diff<60)return '刚刚';
  if(diff<3600)return Math.floor(diff/60)+' 分钟前';
  var days=Math.round((dayStart(now)-dayStart(d))/864e5),hm=pad(d.getHours())+':'+pad(d.getMinutes());
  if(days===0)return hm;
  if(days===1)return '昨天 '+hm;
  if(days<7)return WEEK[d.getDay()];
  return (d.getMonth()+1)+'/'+d.getDate();
}
function dayLabel(ts){
  var d=new Date(ts*1000),now=new Date(),days=Math.round((dayStart(now)-dayStart(d))/864e5);
  if(days===0)return '今天';if(days===1)return '昨天';
  return (d.getFullYear()!==now.getFullYear()?d.getFullYear()+'年':'')+(d.getMonth()+1)+'月'+d.getDate()+'日 '+WEEK[d.getDay()];
}
function hm(ts){var d=new Date(ts*1000);return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtNum(n){
  n=String(n||'');var m=n.replace(/^\+86/,'');
  if(/^1[3-9]\d{9}$/.test(m))return m.slice(0,3)+' '+m.slice(3,7)+' '+m.slice(7);
  return n||'未知号码';
}
function dur(s){if(!s)return '';return s<60?s+' 秒':Math.floor(s/60)+' 分 '+pad(s%60)+' 秒'}
var toastTimer;
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},1600)}
function copy(text,label){
  function ok(){toast('已复制'+(label?label+' ':'')+text)}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,fallback)}else fallback();
  function fallback(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok()}catch(e){toast('复制失败，请长按选择')}document.body.removeChild(ta)}
}

var KINDS=[
  {k:'全部',c:'--k-note'},{k:'个人',c:'--k-me',i:'user'},{k:'验证码',c:'--k-code',i:'shield'},{k:'金融',c:'--k-fin',i:'bank'},
  {k:'快递',c:'--k-exp',i:'box'},{k:'运营商',c:'--k-tel',i:'wifi'},{k:'出行',c:'--k-trip',i:'train'},{k:'通知',c:'--k-note',i:'bell'}
];
var KC={};KINDS.forEach(function(x){KC[x.k]=x});KC['骚扰']={k:'骚扰',c:'--k-spam',i:'warn'};
function kc(kind){return 'var('+((KC[kind]||KC['通知']).c)+')'}
var DANGER=/骚扰|诈骗|欺诈|推销|营销|广告|中介|响一声|保险|理财|猎头|贷款/;
function nature(c){
  if(c.tag)return {t:c.tag,cls:(c.block||DANGER.test(c.tag))?'bad':'info'};
  if(c.ntype==='异常长号码'||c.ntype==='国际号码')return {t:c.ntype,cls:'warn'};
  if(c.ntype)return {t:c.ntype,cls:''};
  return {t:'未标注',cls:''};
}
function isSpamCall(c){var n=nature(c);return n.cls==='bad'}
function missed(c){return c.dir!=='out'&&c.disposition!=='ANSWERED'}

// ───────── 状态 ─────────
var S={tab:'msg',kind:'全部',q:'',sms:[],calls:[],versions:{},thread:null,callFilter:'全部',loaded:false,pendingNum:null};
var firstRun=false,seen={};try{var raw=localStorage.getItem('pb-seen');firstRun=raw===null;seen=JSON.parse(raw||'{}')||{}}catch(e){seen={}}
function saveSeen(){try{localStorage.setItem('pb-seen',JSON.stringify(seen))}catch(e){}}
var callsSeen=0;try{var rc=localStorage.getItem('pb-calls-seen');callsSeen=rc===null?Math.floor(Date.now()/1000):+rc||0;if(rc===null)localStorage.setItem('pb-calls-seen',callsSeen)}catch(e){}
function convKey(m){return m.sig?'sig:'+m.sig:'num:'+m.from}
function convName(m){return m.sig||fmtNum(m.from)}

function buildConvs(list){
  var map={},order=[];
  list.forEach(function(m){
    var k=convKey(m);
    if(!map[k]){map[k]={key:k,name:convName(m),from:m.from,items:[],unread:0};order.push(k)}
    map[k].items.push(m);
  });
  return order.map(function(k){
    var c=map[k];c.items.sort(function(a,b){return b.ts-a.ts});c.last=c.items[0];
    var s=seen[k]||0;c.unread=c.items.filter(function(m){return m.ts>s}).length;return c;
  }).sort(function(a,b){return b.last.ts-a.last.ts});
}
function filtered(){
  var q=S.q.trim().toLowerCase();
  return S.sms.filter(function(m){
    if(S.kind==='全部'){if(m.kind==='骚扰')return false}else if(m.kind!==S.kind)return false;
    if(q&&(m.body+' '+m.from+' '+m.sig).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}

function avatarHtml(name,kind,sm){
  var k=KC[kind]||KC['通知'];var inner;
  if(kind==='个人'||!/[一-龥A-Za-z]/.test(name.charAt(0)))inner=ico(k.i||'msg',sm?17:20);
  else inner=esc(name.charAt(0));
  return '<span class="avatar'+(sm?' sm':'')+'" style="--kc:'+kc(kind)+'">'+inner+'</span>';
}
function previewHtml(m){
  if(m.code)return '<em>'+esc(m.code_label||'验证码')+' '+esc(m.code)+'</em> '+esc(m.body.replace(/^【[^】]*】/,'').split(m.code).join('').replace(/^[\s，,。:：()（）]+/,'').slice(0,60));
  if(m.summary)return '<em>'+esc(m.card)+'</em> '+esc(m.summary);
  return esc(m.body.replace(/^【[^】]*】/,''));
}
function otpCard(){
  var now=Date.now()/1000,m=null;
  for(var i=0;i<S.sms.length;i++){var x=S.sms[i];if(x.code&&x.kind!=='骚扰'&&now-x.ts<600){if(!m||x.ts>m.ts)m=x}}
  if(!m)return '';
  return '<div class="otp"><div class="otp-head">'+ico(m.code_label==='取件码'?'box':'shield',16)+'最新'+esc(m.code_label||'验证码')+'<span class="t">'+relTime(m.ts)+'</span></div>'+
    '<div class="otp-body"><div class="otp-code">'+esc(m.code)+'</div><button class="otp-copy" data-copy="'+esc(m.code)+'" data-label="'+esc(m.code_label||'验证码')+'">'+ico('copy',16)+'复制</button></div>'+
    '<div class="otp-from">'+esc(convName(m))+' · '+esc(m.body.replace(/^【[^】]*】/,'').split(m.code).join('••••').slice(0,40))+'</div></div>';
}
function renderChips(){
  var counts={};S.sms.forEach(function(m){counts[m.kind]=(counts[m.kind]||0)+1});
  var all=S.sms.filter(function(m){return m.kind!=='骚扰'}).length;

function footHtml(){

// ───────── 渲染：对话 ─────────
function openThread(key,push){
  S.thread=key;
  var items=S.sms.filter(function(m){return convKey(m)===key}).sort(function(a,b){return a.ts-b.ts});
  if(!items.length){return}
  var last=items[items.length-1];
  seen[key]=Math.max(seen[key]||0,last.ts);saveSeen();
  $('thAvatar').outerHTML=avatarHtml(convName(last),last.kind,true).replace('class="avatar sm"','class="avatar sm" id="thAvatar"');
  $('thName').textContent=convName(last);
  var nums={};items.forEach(function(m){nums[m.from]=1});
  $('thSub').textContent=Object.keys(nums).map(fmtNum).join('、')+' · '+items.length+' 条';
  $('thCopy').setAttribute('data-copy',last.from);
  var personal=/^(\+86)?1[3-9]\d{9}$/.test(last.from);
  $('thHint').textContent=personal?'':'这是服务号码，回复通常不会被处理';
  var html='',prevDay='';
  items.forEach(function(m){
    var dl=dayLabel(m.ts);if(dl!==prevDay){html+='<div class="day">'+dl+'</div>';prevDay=dl}
    var body=esc(m.body);
    if(m.code){body=body.split(esc(m.code)).join('<mark>'+esc(m.code)+'</mark>')}
    var strip='';
    if(m.summary||m.card&&m.card!=='验证码'){
      strip='<div class="card-strip" style="--kc:'+kc(m.kind)+'"><span class="lbl">'+esc(m.card||m.kind)+'</span><span class="val">'+esc(m.summary||'')+'</span></div>';
    }
    var acts=m.code?'<div class="act-row"><button class="act" data-copy="'+esc(m.code)+'" data-label="'+esc(m.code_label||'验证码')+'">'+ico('copy',15)+'复制'+esc(m.code_label||'验证码')+' '+esc(m.code)+'</button></div>':'';
    var tag=m.kind==='骚扰'?'<span class="nature bad">'+esc(m.cat.indexOf('模型')>=0?'模型判定骚扰':'骚扰')+'</span>':'';
    html+='<div class="bubble-row"><div class="bubble">'+strip+body+acts+'<div class="meta">'+hm(m.ts)+' · '+esc(fmtNum(m.from))+' '+tag+'</div></div></div>';
  });
  (S.sent[key]||[]).forEach(function(t){html+='<div class="bubble-row out"><div class="bubble">'+esc(t.text)+'<div class="meta">'+hm(t.ts)+' · '+esc(t.status)+'</div></div></div>'});
  $('thBody').innerHTML=html;
  $('placeholder').style.display='none';
  $('thread').classList.add('open');
  if(push!==false&&!wide())history.pushState({thread:key},'');
  requestAnimationFrame(function(){$('thBody').scrollTop=$('thBody').scrollHeight});
  render();
}
function closeThread(){S.thread=null;$('thread').classList.remove('open');$('placeholder').style.display='';render()}
function wide(){return matchMedia('(min-width:900px)').matches}
window.addEventListener('popstate',function(){if(S.thread&&!wide())closeThread()});
$('back').onclick=function(){if(history.state&&history.state.thread)history.back();else closeThread()};
S.sent={};

// ───────── 渲染：通话 ─────────
function collapseCalls(list){
  var out=[];
  list.forEach(function(c){
    var p=out[out.length-1];
    if(p&&p.number===c.number&&missed(p)===missed(c)&&p.dir===c.dir&&dayLabel(p.ts)===dayLabel(c.ts)){p.n++;return}
    out.push(Object.assign({n:1},c));
  });
  return out;
}
function renderCalls(){
  var today=dayStart(new Date())/1000,weekAgo=today-6*86400;
  var missToday=S.calls.filter(function(c){return missed(c)&&c.ts>=today}).length;
  var missWeek=S.calls.filter(function(c){return missed(c)&&c.ts>=weekAgo}).length;
  var spam=S.calls.filter(isSpamCall).length;
  var F=['全部','未接','已接','去电'];
  $('chips').innerHTML=F.map(function(f){return '<button class="chip'+(S.callFilter===f?' on':'')+'" data-cf="'+f+'">'+f+'</button>'}).join('');
  var list=S.calls.filter(function(c){
    var q=S.q.trim();if(q&&(c.number+' '+(c.tag||'')+' '+(c.ntype||'')).indexOf(q)<0)return false;
    if(S.callFilter==='未接')return missed(c);
    if(S.callFilter==='已接')return c.dir!=='out'&&!missed(c);
    if(S.callFilter==='去电')return c.dir==='out';
    return true;
  });
  var html='<div class="stats"><div class="stat'+(missToday?' danger':'')+'"><b>'+missToday+'</b><span>今日未接</span></div>'+
    '<div class="stat"><b>'+missWeek+'</b><span>近 7 天未接</span></div><div class="stat"><b>'+spam+'</b><span>骚扰来电</span></div></div>';
  if(!list.length){html+='<div class="empty">'+ico('call',40)+'没有通话记录</div>'}
  var prev='',open=false;
  collapseCalls(list).forEach(function(c){
    var dl=dayLabel(c.ts);
    if(dl!==prev){if(open)html+='</div>';html+='<div class="sec-title">'+dl+'</div><div class="group-card">';prev=dl;open=true}
    var mis=missed(c),out=c.dir==='out',n=nature(c);
    var color=mis?'var(--danger)':out?'var(--k-exp)':'var(--acc)';
    html+='<button class="call" data-num="'+esc(c.number)+'" data-nat="'+esc(n.t)+'">'+
      '<span class="dir" style="--kc:'+color+'">'+ico(mis?'miss':out?'out':'inn',18)+'</span>'+
      '<div class="call-main"><div class="call-num'+(mis?' missed':'')+'">'+esc(fmtNum(c.number))+(c.n>1?'<small>('+c.n+')</small>':'')+'</div>'+
      '<div class="call-l2"><span class="nature '+n.cls+'">'+esc(n.t)+'</span>'+(c.loc?'<span>'+esc(c.loc)+'</span>':'')+'<span>'+(mis?(out?'未接通':'未接来电'):out?'去电':'已接')+'</span>'+(c.src&&c.src.indexOf('在线')===0?'<span class="online">在线识别</span>':'')+
      (c.billsec?'<span>· '+dur(c.billsec)+'</span>':'')+'</div></div>'+
      '<div class="call-time">'+hm(c.ts)+'</div></button>';
  });
  if(open)html+='</div>';
  html+=footHtml();
  $('list').innerHTML=html;
}

// ───────── 渲染：拦截 ─────────
function renderBlock(){
  $('chips').innerHTML='';

    '<div class="stat danger"><b>'+spamCalls.length+'</b><span>骚扰来电</span></div>'+
    '<div class="stat"><b>'+S.calls.filter(function(c){return c.ntype==='异常长号码'}).length+'</b><span>异常长号码</span></div></div>';
  html+='<div class="sec-title">骚扰来电 · 号码库标注</div>';
  html+=spamCalls.length?'<div class="group-card">'+spamCalls.slice(0,40).map(function(c){
    var n=nature(c);return '<button class="call" data-num="'+esc(c.number)+'" data-nat="'+esc(n.t)+'"><span class="dir" style="--kc:var(--danger)">'+ico('block',18)+'</span>'+
      '<div class="call-main"><div class="call-num">'+esc(fmtNum(c.number))+'</div><div class="call-l2"><span class="nature bad">'+esc(n.t)+'</span><span>'+(missed(c)?'未接':'已接')+'</span></div></div>'+
      '<div class="call-time">'+relTime(c.ts)+'</div></button>'}).join('')+'</div>':'<div class="empty" style="padding:24px">没有被标注的骚扰来电</div>';
  html+='<div class="sec-title">骚扰短信 · 本机模型 / 规则判定</div>';
  html+=spamSms.length?'<div class="group-card">'+spamSms.slice(0,60).map(function(m){
    return '<div class="spam"><div class="spam-l1"><b>'+esc(convName(m))+'</b><span class="nature bad">'+esc(m.cat.indexOf('模型')>=0?'模型判定':'规则判定')+'</span><span style="margin-left:auto">'+relTime(m.ts)+'</span></div>'+
      '<div class="spam-body">'+esc(m.body)+'</div></div>'}).join('')+'</div>':'<div class="empty" style="padding:24px">没有骚扰短信</div>';
  html+=footHtml();
  $('list').innerHTML=html;
}

function render(){
  var app=$('app');
  app.classList.toggle('single',S.tab!=='msg');
  $('title').textContent={msg:'信息',call:'通话',block:'拦截'}[S.tab];
  $('searchBox').style.display=S.tab==='block'?'none':'';
  $('q').placeholder=S.tab==='call'?'搜索号码或来电性质':'搜索短信、号码、签名';
  $('markRead').style.display=S.tab==='msg'?'':'none';
  $('fab').style.display=S.tab==='block'?'none':'';
  var unread=buildConvs(S.sms.filter(function(m){return m.kind!=='骚扰'})).reduce(function(a,c){return a+c.unread},0);
  var newMissed=S.calls.filter(function(c){return missed(c)&&c.ts>callsSeen}).length;
  $('dotMsg').hidden=!unread;$('dotMsg').textContent=unread>99?'99+':unread;
  $('dotCall').hidden=!newMissed||S.tab==='call';$('dotCall').textContent=newMissed;
  $('subtitle').textContent=!S.loaded?'正在加载…':S.tab==='msg'?(unread?unread+' 条未读':'没有未读短信'):S.tab==='call'?'共 '+S.calls.length+' 条记录':'本机识别，正文与号码不出本机';
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.getAttribute('data-tab')===S.tab)});
  if(S.tab==='msg')renderMsgs();else if(S.tab==='call')renderCalls();else renderBlock();
}

// ───────── 交互 ─────────
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-copy]');
  if(t){e.stopPropagation();e.preventDefault();copy(t.getAttribute('data-copy'),t.getAttribute('data-label')||'');return}
  t=e.target.closest('[data-kind]');if(t){S.kind=t.getAttribute('data-kind');render();$('list').scrollTop=0;return}
  t=e.target.closest('[data-cf]');if(t){S.callFilter=t.getAttribute('data-cf');render();return}
  t=e.target.closest('[data-conv]');if(t){openThread(t.getAttribute('data-conv'));return}
  t=e.target.closest('[data-num]');if(t){openCallSheet(t.getAttribute('data-num'),t.getAttribute('data-nat'));return}
  t=e.target.closest('[data-tab]');if(t){S.tab=t.getAttribute('data-tab');S.q='';$('q').value='';
    if(S.tab==='call'){callsSeen=Math.floor(Date.now()/1000);try{localStorage.setItem('pb-calls-seen',callsSeen)}catch(e2){}}
    if(S.tab!=='msg'&&S.thread&&!wide()){closeThread()}
    render();$('list').scrollTop=0;return}
});
$('q').addEventListener('input',function(){S.q=this.value;render()});
$('markRead').onclick=function(){S.sms.forEach(function(m){var k=convKey(m);seen[k]=Math.max(seen[k]||0,m.ts)});saveSeen();render();toast('已全部标为已读')};
$('reply').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';$('sendReply').disabled=!this.value.trim()});
$('sendReply').onclick=function(){
  var key=S.thread;if(!key)return;var it=S.sms.filter(function(m){return convKey(m)===key});if(!it.length)return;
  var to=it[0].from,text=$('reply').value.trim();if(!text)return;
  var rec={text:text,ts:Date.now()/1000,status:'发送中…'};(S.sent[key]=S.sent[key]||[]).push(rec);
  $('reply').value='';$('sendReply').disabled=true;openThread(key,false);
  sendSms(to,text).then(function(r){rec.status=r.ok?'已交给模块发送':'发送失败：'+r.msg;openThread(key,false)});
};
function sendSms(to,text){
  return fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json','X-Phonebox':'1'},body:JSON.stringify({to:to,text:text})})
    .then(function(r){if(r.status===401){location.replace('/?expired=1');throw new Error('expired')}return r.json()})
    .catch(function(e){return {ok:false,msg:e.message==='expired'?'登录已过期':'网络错误'}});
}
// 弹层
function openSheet(id){$('mask').classList.add('open');$(id).classList.add('open')}
function closeSheets(){$('mask').classList.remove('open');document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('open')})}
$('mask').onclick=closeSheets;
$('fab').onclick=function(){$('cTo').value=S.pendingNum||'';$('cText').value='';$('cMsg').textContent='';S.pendingNum=null;openSheet('composeSheet');setTimeout(function(){($('cTo').value?$('cText'):$('cTo')).focus()},250)};
$('cSend').onclick=function(){
  var to=$('cTo').value.replace(/\s/g,''),text=$('cText').value.trim();
  if(!to||!text){$('cMsg').textContent='号码和内容都要填';return}
  $('cMsg').textContent='发送中…';$('cSend').disabled=true;
  sendSms(to,text).then(function(r){$('cSend').disabled=false;$('cMsg').textContent=r.ok?'已交给模块发送':'发送失败：'+r.msg;if(r.ok){$('cText').value='';setTimeout(closeSheets,900)}});
};
var sheetNum='';
function openCallSheet(num,nat){
  sheetNum=num;$('csTitle').textContent=fmtNum(num);var cc=S.calls.filter(function(x){return x.number===num})[0]||{};$('csSub').textContent='来电性质：'+(nat||'未标注')+(cc.loc?' · 归属地 '+cc.loc:'')+(cc.src?' · 来源 '+cc.src:'');
  var has=S.sms.some(function(m){return m.from===num});$('csThread').style.display=has?'':'none';openSheet('callSheet');
}
$('csCopy').onclick=function(){copy(sheetNum,'号码');closeSheets()};
$('csSms').onclick=function(){closeSheets();S.pendingNum=sheetNum;setTimeout(function(){$('fab').onclick()},200)};
$('csThread').onclick=function(){closeSheets();var m=S.sms.filter(function(x){return x.from===sheetNum})[0];if(!m)return;S.tab='msg';S.kind=m.kind==='骚扰'?'全部':S.kind;render();openThread(convKey(m))};
$('thCopy').onclick=function(){var n=this.getAttribute('data-copy');if(n)copy(n,'号码')};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeSheets();if(S.thread&&!wide())closeThread()}});

// ───────── 数据 ─────────
var lastCodeTs=0;
function load(){
  return fetch('/api/feed',{cache:'no-store'}).then(function(r){
    if(r.status===401){location.replace('/?expired=1');throw new Error('expired')}
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  }).then(function(d){
    var first=!S.loaded;S.sms=d.sms||[];S.calls=d.calls||[];S.versions=d.versions||{};S.loaded=true;
    if(firstRun){firstRun=false;S.sms.forEach(function(m){var k=convKey(m);seen[k]=Math.max(seen[k]||0,m.ts)});saveSeen()}
    var newest=S.sms.filter(function(m){return m.code&&m.kind!=='骚扰'}).reduce(function(a,m){return Math.max(a,m.ts)},0);
    if(!first&&newest>lastCodeTs)toast('收到新验证码');
    lastCodeTs=newest;
    if(S.thread&&S.tab==='msg'){openThread(S.thread,false)}else render();
  }).catch(function(e){if(e.message!=='expired'){$('subtitle').textContent='加载失败，稍后自动重试'}});
}
render();load();
setInterval(function(){if(document.visibilityState==='visible')load()},15000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')load()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw-v3.js').catch(function(){})}
})();
</script>
</body>
